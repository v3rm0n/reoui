name: reoui
x-common: &common
  image: ${REOUI_IMAGE:-reoui:local}
  build: .
  user: "${REOUI_UID:-1000}:${REOUI_GID:-1000}"
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=128m,mode=1777
  environment: &environment
    REOUI_ARCHIVE: /recordings
    REOUI_DATA: /data
    REOUI_CACHE: /cache
    REOUI_TIMEZONE: ${REOUI_TIMEZONE:-Europe/Tallinn}
    REOUI_CACHE_BYTES: ${REOUI_CACHE_BYTES:-200000000000}
    REOUI_SCAN_INTERVAL: ${REOUI_SCAN_INTERVAL:-900}
    REOUI_SCAN_TIMEOUT: ${REOUI_SCAN_TIMEOUT:-180}
    REOUI_CAMERA_INTERVAL: ${REOUI_CAMERA_INTERVAL:-300}
    REOUI_STABLE_SECONDS: ${REOUI_STABLE_SECONDS:-60}
    REOUI_AUTO_PROXY_HOURS: ${REOUI_AUTO_PROXY_HOURS:-24}

services:
  app:
    <<: *common
    ports:
      - "${REOUI_BIND:-127.0.0.1}:${REOUI_PORT:-8090}:8090"
    environment:
      <<: *environment
      REOUI_AUTH_TOKEN: ${REOUI_AUTH_TOKEN:-}
      FORWARDED_ALLOW_IPS: ${REOUI_TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - type: bind
        source: ${REOUI_ARCHIVE:?Set REOUI_ARCHIVE in .env}
        target: /recordings
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REOUI_DATA_DIR:-./.local/data}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${REOUI_CACHE_DIR:-./.local/cache}
        target: /cache
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
  worker:
    <<: *common
    command: [worker]
    environment:
      <<: *environment
      REOUI_CAMERAS_FILE: /run/secrets/cameras
    secrets: [cameras]
    volumes:
      - type: bind
        source: ${REOUI_ARCHIVE:?Set REOUI_ARCHIVE in .env}
        target: /recordings
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REOUI_DATA_DIR:-./.local/data}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${REOUI_CACHE_DIR:-./.local/cache}
        target: /cache
        bind: {create_host_path: false}
    cpus: 1.5
    mem_limit: 1536m
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, python, -c, "import sqlite3,json,time; c=sqlite3.connect('/data/archive.sqlite3'); r=c.execute(\"SELECT value FROM state WHERE key='worker'\").fetchone(); assert r and time.time()-json.loads(r[0])['heartbeat']<30"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  cameras:
    file: ${REOUI_CAMERAS_FILE:-./.secrets/cameras.json}
